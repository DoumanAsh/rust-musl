name: Docker

on:
  # Once a week
  schedule:
    - cron: '0 0 * * 0'
  push:
    paths:
      - 'Dockerfile'
      - 'config.toml'
      - '.github/workflows/docker-image.yml'
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'
    paths:
      - 'Dockerfile'
      - 'config.toml'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:
    inputs:
      rustc_version:
        description: 'Rust version'
        required: false
        default: ''
        type: string

jobs:
  container:
    name: "${{ github.event.repository.name }}:${{ inputs.rustc_version || 'stable' }}"
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      packages: write
      pull-requests: write
    uses: DoumanAsh/douman-ci/.github/workflows/release-container.yaml@master
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
    with:
      # Make sure to create repos in all container registries using the same name as the repo
      image_name: ${{ github.event.repository.name }}
      # Need dhi.io for hardened alpine image
      dhi_login: true
      container_file: "Dockerfile"
      use_oci: true
      platform: "linux"
      archs: "amd64 arm64"
      upload_container: ${{ github.event.pull_request.draft == false }}
      docker_user: "douman"
      github_user: "doumanash"
      quay_user: "doumanash"
      quay_bot_suffix: "rust-musl-ci"
      build_args: RUST_VERSION=${{ inputs.rustc_version || 'stable' }}
      post_build_script: |
          VERSION=$(podman run --rm ${{ github.event.repository.name }} rustc --version | cut -d" " -f2)
          echo "rustc_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "- Rustc version: $VERSION" >> $GITHUB_STEP_SUMMARY
          SHORT_VERSION=$(echo "$VERSION" | cut -d"." -f 1,2)
          echo "rustc_short_version=$SHORT_VERSION" >> "$GITHUB_OUTPUT"
          ALPINE_VERSION=$(podman run --rm ${{ github.event.repository.name }} cat /etc/os-release | grep VERSION_ID | cut -d"=" -f2 | tr -d '"' | cut -d"." -f 1,2)
          echo "alpine_version=$ALPINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "- Alpine version: $ALPINE_VERSION" >> $GITHUB_STEP_SUMMARY

          echo "tags=latest $VERSION $SHORT_VERSION $VERSION-alpine$ALPINE_VERSION $SHORT_VERSION-alpine$ALPINE_VERSION" >> "$GITHUB_OUTPUT"
